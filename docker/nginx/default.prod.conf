server {
    listen 80;
    server_name tekutto-news.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name tekutto-news.com;

    ssl_certificate     /etc/letsencrypt/live/tekutto-news.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tekutto-news.com/privkey.pem;

    # Block hidden files/directories such as .env, .git and .aws.
    # Allow Let's Encrypt ACME challenges.
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Block common sensitive/debug files.
    location ~* (^|/)(credentials(?:\.json)?|phpinfo\.php)(?:/|$) {
        return 404;
    }

    location /api/       { include /etc/nginx/fastcgi_laravel.conf; }
    location /sanctum/   { include /etc/nginx/fastcgi_laravel.conf; }
    location /email/     { include /etc/nginx/fastcgi_laravel.conf; }
    location /user/      { include /etc/nginx/fastcgi_laravel.conf; }
    location /two-factor { include /etc/nginx/fastcgi_laravel.conf; }

    location ~ ^/(login|logout|register|forgot-password|reset-password)$ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }

        include /etc/nginx/fastcgi_laravel.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
# Replace example.com with your actual domain before deploying.
# Also update the ssl_certificate paths below.

server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location /api/       { include /etc/nginx/fastcgi_laravel.conf; }
    location /sanctum/   { include /etc/nginx/fastcgi_laravel.conf; }
    location /email/     { include /etc/nginx/fastcgi_laravel.conf; }
    location /user/      { include /etc/nginx/fastcgi_laravel.conf; }
    location /two-factor { include /etc/nginx/fastcgi_laravel.conf; }

    location ~ ^/(login|logout|register|forgot-password|reset-password)$ {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }
        include /etc/nginx/fastcgi_laravel.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.ht {
        deny all;
    }
}
